name: pitching_analytics
description: SKOUTAR — baseball pitching analytics (Flutter port of the R Shiny application).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6     # Auth + Postgres (users, pitches, settings) — shared backend
  intl: ^0.19.0                # Date formatting
  fl_chart: ^0.68.0            # Bar / line / pie charts (Usage%, ERA trend, etc.)
  uuid: ^4.4.0                 # Unique IDs for users / games / pitch events
  collection: ^1.18.0          # groupBy helpers used throughout stats_service
  provider: ^6.1.2             # App-wide state management (AppSession)
  pdf: ^3.11.1                 # Builds the Scouting Report PDF export
  printing: ^5.13.4            # Cross-platform "share/download/print" of the generated PDF
  url_launcher: ^6.3.0         # Opens the Terms of Service / Privacy Policy links
  purchases_flutter: ^10.10.0  # RevenueCat: in-app subscriptions (iOS / Android)
  purchases_ui_flutter: ^10.10.0 # RevenueCat Customer Center

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko-Light.ttf
          weight: 300
        - asset: assets/fonts/Teko-Regular.ttf
          weight: 400
        - asset: assets/fonts/Teko-Medium.ttf
          weight: 500
        - asset: assets/fonts/Teko-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Teko-Bold.ttf
          weight: 700
  assets:
    - assets/images/logo.png
    - assets/images/logo_watermark.png
    - assets/images/field_bg.png
